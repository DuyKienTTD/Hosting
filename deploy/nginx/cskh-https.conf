server {
    listen 80;
    server_name cskh.thuanthanhdat.com.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cskh-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://cskh.thuanthanhdat.com.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cskh.thuanthanhdat.com.vn;

    ssl_certificate /etc/letsencrypt/live/cskh.thuanthanhdat.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cskh.thuanthanhdat.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    client_max_body_size 64k;
    client_body_timeout 2s;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* ^/(internal|operator)(/|$) {
        return 404;
    }

    location = /webhooks/zalo-oa {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18081;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
    }
}
