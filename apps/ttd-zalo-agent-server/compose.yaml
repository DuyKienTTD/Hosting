services:
  runtime:
    build:
      context: ../..
      dockerfile: apps/ttd-zalo-agent-server/Dockerfile
      args:
        INSTALL_UI_BROWSER: ${INSTALL_UI_BROWSER:-0}
    env_file: .env
    environment:
      HTTP_BIND: container
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - database:/data
      - backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
  backups:
