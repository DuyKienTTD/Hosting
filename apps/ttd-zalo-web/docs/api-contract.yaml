openapi: 3.0.3
info:
  title: TTD Zalo Operator API
  version: 0.1.0
  description: Bản đề xuất hợp đồng. Production thực thi xác thực, phân quyền và kiểm tra nghiệp vụ ở server. ADS_ENABLED=false
    trong pilot.
servers:
- url: /api/v1
security:
- operatorSession: []
paths:
  /session:
    get:
      operationId: readSession
      description: 'Trả tài khoản và vai trò do server xác định. Phản hồi Cache-Control: no-store.'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createSession
      description: Xác thực tài khoản vận hành, giới hạn thử đăng nhập và cấp cookie phiên HttpOnly, Secure, SameSite=Strict
        khi thành công. Từ chối Origin ngoài nguồn cho mọi yêu cầu thay đổi trạng thái. demoRole chỉ có trong MSW.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Đã vượt giới hạn đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account
              - passphrase
              properties:
                account:
                  type: string
                  minLength: 1
                passphrase:
                  type: string
                  minLength: 1
                  format: password
              additionalProperties: false
      security: []
    delete:
      operationId: endSession
      description: Thu hồi phiên ở server và xóa cookie.
      responses:
        '204':
          description: Thành công
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workspace:
    get:
      operationId: readWorkspace
      description: 'Chỉ trả dữ liệu được vai trò hiện tại phép đọc. Phản hồi Cache-Control: no-store. Không chứa
        provider, mô hình hay ngân sách AI Router.'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /conversations/{id}/approve:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: approveDraft
      description: Ghi phê duyệt có người thực hiện và đưa vào hàng đợi một lần theo id và version. Kiểm tra quyền,
        người nhận và chính sách. Worker phải kiểm tra lại Guard, consent, opt-out, STOP, trạng thái kênh và ADS_ENABLED
        ngay trước khi gửi. review và stop đều chặn. Không gửi lại unknown_delivery. Phản hồi queued chỉ xác nhận
        đã xếp hàng.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy dữ liệu trong phạm vi phiên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột phiên bản, chính sách hoặc trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
      - support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - text
              properties:
                version:
                  type: integer
                  minimum: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
              additionalProperties: false
  /quotes:
    post:
      operationId: createQuote
      description: Đọc giá và quy cách từ server. 1 m = 1000 mm, 1 thanh = millimetresPerBar, 1 bộ = barsPerSet
        thanh. Làm tròn tổng VND một lần sau khi nhân tổng mm với đơn giá mỗi mét rồi chia 1000. Lưu báo giá nội
        bộ, không gửi khách. Kiểm tra khách, quy cách, số lượng, xác nhận và mã bảng giá đã duyệt còn hiệu lực trước
        khi lưu.
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Thiếu xác nhận, giá chưa duyệt hoặc phiên bản giá đã thay đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
      - sales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmedQuote'
  /work-items:
    post:
      operationId: createWorkItem
      description: Chỉ phiên vận hành được phân quyền mới tạo phiếu. Nội dung khách hàng không được dùng làm lệnh
        điều phối. Kiểm tra tên agent bằng danh sách cho phép.
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400': &id001
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - agent
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 250
                agent:
                  type: string
              additionalProperties: false
  /channels/nick/stop:
    post:
      operationId: stopNick
      description: Lệnh dừng lặp an toàn. Ghi STOP bền trước khi trả kết quả, chặn lần gửi tiếp theo qua nick và
        báo trạng thái stopped.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
  /deletion-requests:
    post:
      operationId: requestDeletion
      description: Chỉ tạo yêu cầu chờ kiểm tra, không tự cung cấp quyền xóa. Backend kiểm tra legal hold, chứng
        cứ và nghĩa vụ lưu trước mọi thao tác dữ liệu. Một yêu cầu đang xử lý trên mỗi khách.
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột phiên bản, chính sách hoặc trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - reason
              properties:
                customerId:
                  type: string
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              additionalProperties: false
  /room-messages:
    post:
      operationId: postRoomMessage
      description: Ghi trao đổi nội bộ từ người vận hành có quyền, dùng danh tính trong phiên làm tác giả. Nội dung
        và @mention chỉ dùng trong phòng điều phối. Thao tác tạo phiếu gọi API work-items riêng.
      x-roles:
      - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
              additionalProperties: false
      responses:
        '201':
          description: Đã ghi trao đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMessage'
        '400': *id001
        '401': *id002
        '403': *id003
  /quotes/oa-send:
    post:
      operationId: approveAndQueueOaQuote
      description: Xác thực người vận hành, tra khách và báo giá từ dữ liệu server rồi gọi SendGuard.dispatch. Guard
        dùng lần tương tác cuối từ PostgreSQL và đồng hồ server. Dưới 48h không dùng quota, từ 48h đến dưới 7 ngày
        Guard giữ chỗ quota tháng trong giao dịch send_log, từ đúng 7 ngày trả 409 oa_window_expired. Hết quota
        trả 409 quota_exhausted. OA xác nhận tiếp nhận thì trả delivery=sent. Không gửi lại unknown_delivery.
      responses:
        '201':
          description: OA xác nhận tiếp nhận báo giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentQuote'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực hoặc phiên hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền hoặc yêu cầu khác nguồn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Giá, xác nhận hoặc chính sách gửi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OaQuoteConflict'
        '502':
          description: Lượt gửi thất bại hoặc chưa rõ đã giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - owner
      - sales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmedQuote'
  /agent-router:
    get:
      operationId: readAgentRouter
      description: 'Chủ dự án nhận cấu hình và chi phí AI. A0 chỉ nhận trạng thái available hoặc capped. Phản hồi Cache-Control: no-store.'
      x-roles:
      - owner
      - a0
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Router'
                - $ref: '#/components/schemas/RouterStatus'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Vai trò không được phép xem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /settings:
    get:
      operationId: readSettings
      description: 'Chỉ Chủ dự án và A0 được xem. A0 không có quyền sửa. Phản hồi Cache-Control: no-store.'
      x-roles:
      - owner
      - a0
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Vai trò không được phép xem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operators:
    post:
      operationId: createOperator
      description: Chủ dự án tạo tài khoản Bán hàng hoặc CSKH. Vai trò người tạo lấy từ phiên, kiểm tra Origin cho
        thao tác ghi.
      x-roles:
      - owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account
              - label
              - role
              - passphrase
              additionalProperties: false
              properties:
                account:
                  type: string
                  maxLength: 120
                label:
                  type: string
                  minLength: 1
                  maxLength: 120
                role:
                  type: string
                  enum:
                  - sales
                  - support
                passphrase:
                  type: string
                  format: password
                  minLength: 16
                  maxLength: 256
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Phiên chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Vai trò hoặc nguồn yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tài khoản trùng hoặc quyền đã bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /inbox:
    get:
      operationId: listOaInbox
      description: Hội thoại OA theo mã nội bộ. Không trả mã UID OA.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OaThread'
        '401': &id004
          description: Yêu cầu bị từ chối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /inbox/{id}:
    parameters:
    - &id005
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: readOaThread
      description: Chủ dự án và CSKH xem nội dung. Sales/A0 nhận metadata và nội dung null.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OaThreadDetail'
        '401': *id004
        '404': *id004
        '503': *id004
  /inbox/{id}/replies:
    parameters:
    - *id005
    post:
      operationId: replyToOaThread
      x-roles:
      - owner
      - support
      description: Gửi qua Guard với đích và timestamp do server xác định. Có thể từ chối do STOP, smoke-only, hết
        hạn, quota hoặc consent. Không tự gửi lại khi chưa rõ kết quả.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1500
              required:
              - text
      responses:
        '201':
          description: OA xác nhận tiếp nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery:
                    type: string
                    enum:
                    - sent
                required:
                - delivery
        '400': *id004
        '401': *id004
        '403': *id004
        '404': *id004
        '409': *id004
        '502': *id004
        '503': *id004
  /conversations/{id}/drafts:
    parameters:
    - &id007
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listConversationDrafts
      x-roles:
      - owner
      - support
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required:
                - drafts
                properties:
                  drafts:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboxDraft'
        '401': &id006
          description: Yêu cầu bị từ chối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id006
  /drafts/{id}/regenerate:
    parameters:
    - *id007
    post:
      operationId: regenerateInboxDraft
      x-roles:
      - owner
      - support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxDraft'
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
        '409': *id006
  /drafts/{id}/approve:
    parameters:
    - *id007
    post:
      operationId: approveInboxDraft
      x-roles:
      - owner
      - support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: integer
                  minimum: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 1500
                  description: Nội dung người vận hành đã sửa. Duyệt khóa nội dung và không gửi OA.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - conversationId
                - version
                - text
                properties:
                  id:
                    type: string
                    format: uuid
                  conversationId:
                    type: string
                    format: uuid
                  version:
                    type: integer
                    minimum: 1
                  text:
                    type: string
        '400': *id006
        '401': *id006
        '403': *id006
        '404': *id006
        '409': *id006
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: ttd_operator_session
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: string
      additionalProperties: false
    Operator:
      type: object
      required:
      - id
      - label
      - role
      properties:
        id:
          type: string
        label:
          type: string
        role:
          type: string
          enum:
          - owner
          - support
          - sales
          - a0
      additionalProperties: false
    Unit:
      type: string
      enum:
      - metre
      - bar
