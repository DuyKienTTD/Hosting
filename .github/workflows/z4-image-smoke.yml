name: Z4 production image smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/ttd-zalo-agent-server/**'
      - 'apps/ttd-zalo-assistant/**'
      - 'apps/ttd-zalo-web/**'
      - 'deploy/**'
      - '.github/workflows/z4-image-smoke.yml'
permissions:
  contents: read
jobs:
  entrypoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce the packaged runtime failure on a96a91c
        if: github.event.pull_request.base.sha == 'a96a91c308436e86a07b2a3a273c784137baaed1'
        env:
          BROKEN_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BROKEN_REF"
          baseline=$(mktemp -d)
          git archive "$BROKEN_REF" | tar -x -C "$baseline"
          docker build -t z4-smoke-baseline:local -f "$baseline/apps/ttd-zalo-agent-server/Dockerfile.data" "$baseline"
          status=0
          docker run --rm --network none --entrypoint node z4-smoke-baseline:local \
            dist/ttd-zalo-agent-server/src/main.js serve > "$RUNNER_TEMP/z4-baseline.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/z4-baseline.log"
          test "$status" -eq 1
          grep -F "does not provide an export named 'FakeProvider'" "$RUNNER_TEMP/z4-baseline.log"
      - name: Build production app and Postgres images
        run: |
          app=apps/ttd-zalo-agent-server
          docker build -t z4-smoke-app:local -f "$app/Dockerfile.data" .
          docker build -t z4-smoke-postgres:local "$app/postgres"
      - name: Refresh an expired fixture token into a private tmpfs
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          cat > "$fixture/source.conf" <<'CONFIG'
          [fixture]
          type = drive
          client_id = fixture
          client_secret = fixture
          scope = drive.file
          token = {"access_token":"fixture-expired","refresh_token":"fixture-refresh","expiry":"2000-01-01T00:00:00Z"}
          CONFIG
          chmod 0444 "$fixture/source.conf"
          for uid in 0 1000; do
            docker run --rm --read-only --network none --cap-drop ALL --user "$uid:$uid" \
              --tmpfs "/run/rclone-live:uid=$uid,gid=$uid,mode=0700" \
              --mount "type=bind,source=$fixture/source.conf,target=/run/rclone-source.conf,readonly" \
              --mount "type=bind,source=$PWD/deploy/with-rclone-config.sh,target=/deploy/with-rclone-config.sh,readonly" \
              --mount "type=bind,source=$PWD/deploy/test-rclone-refresh.mjs,target=/deploy/test-rclone-refresh.mjs,readonly" \
              --entrypoint sh z4-smoke-app:local /deploy/with-rclone-config.sh sh -ec \
              'test "$(stat -f -c %T "$RCLONE_CONFIG")" = tmpfs; node /deploy/test-rclone-refresh.mjs'
          done
      - name: Start production entrypoints and require HTTP 200
        run: |
          fixture=$(mktemp -d)
          touch "$fixture/rclone.conf"
          mkdir -p "$fixture/storage/dump/tombstones"
          printf 'z4-tombstones-v1\n' > "$fixture/storage/dump/tombstones/_format"
          cat > "$fixture/storage.yml" <<YAML
          services:
            worker:
              volumes:
                - "$fixture/storage:/run/z4-smoke-storage:ro"
          YAML
          env_file="$fixture/fixture.env"
          export env_file fixture
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          fixture = Path(os.environ["fixture"])
          values = {
              "DATA_APP_IMAGE": "z4-smoke-app:local",
              "DATA_POSTGRES_IMAGE": "z4-smoke-postgres:local",
              "AI_ROUTER_BASE_URL": "https://router.example.invalid",
              "AI_ROUTER_DAILY_USD": "1",
              "AI_ROUTER_RATE_MULTIPLIER": "1",
              "ZALO_APP_ID": "fixture_app",
              "ZALO_OA_ID": "fixture_oa",
              "SMOKE_ALLOWLIST": "",
              "BACKUP_REMOTE": ":local:/run/z4-smoke-storage/dump",
              "PURGE_RECEIPT_REMOTE": ":local:/run/z4-smoke-storage/receipt",
              "PURGE_RECEIPT_BACKUP_REMOTE": ":local:/run/z4-smoke-storage/receipt-copy",
              "AGE_RECIPIENT": "unused_fixture",
              "WORKER_RCLONE_FILE": str(fixture / "rclone.conf"),
              "BACKUP_RCLONE_FILE": str(fixture / "rclone.conf"),
          }
          entries = []
          for line in Path("deploy/.env.example").read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              key, default = line.split("=", 1)
              entries.append(f"{key}={values.get(key, default or secrets.token_hex(32))}")
          Path(os.environ["env_file"]).write_text("\n".join(entries) + "\n")
          PY
          compose() { docker compose --env-file "$env_file" -p z4-image-smoke -f deploy/compose.prod.yml -f "$fixture/storage.yml" "$@"; }
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              compose ps -a || true
              compose logs --no-color postgres runtime oa-ingress data-api worker || true
            fi
            docker rm -f z4-image-smoke-nginx >/dev/null 2>&1 || true
            compose down -v --remove-orphans || true
          }
          trap cleanup EXIT
          compose up -d --wait --wait-timeout 150 postgres runtime oa-ingress data-api worker
          TRUSTED_PROXY=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .Gateway}}{{end}}' "$(compose ps -q runtime)" | awk 'NF' | paste -sd, -)
          test -n "$TRUSTED_PROXY"
          export TRUSTED_PROXY
          compose up -d --wait --wait-timeout 80 runtime
          compose exec -T postgres sh -s < deploy/smoke-web-migrations.sh
          for service in runtime oa-ingress data-api worker; do
            port=8080
            if [ "$service" = worker ]; then port=8081; fi
            compose exec -T "$service" node -e '
              fetch("http://127.0.0.1:" + process.argv[1] + "/health", { signal: AbortSignal.timeout(3000) })
                .then(response => {
                  if (response.status !== 200) throw Error("HTTP " + response.status);
                  console.log(process.argv[2] + " /health = 200");
                })
                .catch(error => { console.error(error.message); process.exitCode = 1; });
            ' "$port" "$service"
          done

          empty=$(compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*)=0 FROM web_operators"')
          if [ "$empty" != t ]; then echo 'FAIL 02 an operator was already present after initialization'; exit 1; fi
          umask 077
          openssl rand -hex 24 > "$fixture/owner-passphrase"
          if ! compose exec -T runtime node dist/ttd-zalo-agent-server/src/main.js \
            web-bootstrap-owner fixture-owner 'Fixture owner' < "$fixture/owner-passphrase" > "$fixture/bootstrap.log" 2>&1; then
            echo 'FAIL 01 bootstrapped owner through stdin'
            exit 1
          fi
          if compose exec -T runtime node dist/ttd-zalo-agent-server/src/main.js \
            web-bootstrap-owner second-owner 'Second owner' < "$fixture/owner-passphrase" >> "$fixture/bootstrap.log" 2>&1; then
            echo 'FAIL 01 repeated bootstrap was accepted'
            exit 1
          fi
          if grep -Fq -f "$fixture/owner-passphrase" "$fixture/bootstrap.log"; then
            echo 'FAIL 01 passphrase appeared in CLI output'
            exit 1
          fi
          echo 'PASS 01 owner bootstrap via stdin; password absent from output; second bootstrap refused'
          state=$(compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          SELECT count(*)=1 AND bool_and(role='owner' AND verifier ~ '^[a-f0-9]{32}:[a-f0-9]{128}$') FROM web_operators;
          SQL
          )
          if [ "$state" != t ]; then echo 'FAIL 02 owner account/verifier'; exit 1; fi
          if ! grep -q 'promisify(scrypt)' apps/ttd-zalo-agent-server/src/web/accounts.ts; then echo 'FAIL 02 scrypt implementation'; exit 1; fi
          echo 'PASS 02 no preseeded account; exactly one bootstrapped owner with salted scrypt verifier'
          mkdir "$fixture/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=cskh.thuanthanhdat.com.vn \
            -addext subjectAltName=DNS:cskh.thuanthanhdat.com.vn \
            -keyout "$fixture/certs/privkey.pem" -out "$fixture/certs/fullchain.pem"
          docker run -d --name z4-image-smoke-nginx --network host \
            --mount "type=bind,source=$PWD/deploy/nginx/cskh-https.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$fixture/certs,target=/etc/letsencrypt/live/cskh.thuanthanhdat.com.vn,readonly" \
            nginx:1.28-alpine
          curl --silent --show-error --fail --noproxy '*' --retry 5 --retry-connrefused \
            --resolve cskh.thuanthanhdat.com.vn:443:127.0.0.1 --cacert "$fixture/certs/fullchain.pem" \
            https://cskh.thuanthanhdat.com.vn/health >/dev/null
          rejected=$(curl --silent --show-error --fail --noproxy '*' \
            --resolve cskh.thuanthanhdat.com.vn:443:127.0.0.1 --cacert "$fixture/certs/fullchain.pem" \
            -H 'Content-Type: application/json' -d '{}' https://cskh.thuanthanhdat.com.vn/webhooks/zalo-oa)
          test "$rejected" = '{"error":0}'
          receipts=$(compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM oa_inbox"')
          test "$receipts" = 0
          echo 'PASS OA unsigned probe acknowledged with zero receipts'
          python3 deploy/smoke-web.py "$fixture/certs/fullchain.pem" "$fixture/owner-passphrase"
          compose exec -T data-api node --input-type=module < deploy/smoke-web-peer.mjs
