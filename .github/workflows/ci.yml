name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Kiểm tra bắt buộc (bí mật, PII, Zalo, work/*.json, link)
        run: python3 scripts/check.py
